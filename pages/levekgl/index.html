<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LevekGL — Learning How Rendering Works | Quentin Guignard</title>
  <meta name="description" content="A student C++ and OpenGL rendering project exploring shaders, Assimp scene loading, GPU resources and physics experiments.">
  <meta property="og:title" content="LevekGL — Learning How Rendering Works">
  <meta property="og:description" content="Building a small rendering library to understand the path from a Blender asset to an interactive frame.">
  <meta property="og:image" content="../../resources/levek/levek-phong-lighting.jpg">
  <link rel="stylesheet" href="../../style.css">
  <style>
    body.article-view { display: block; padding: clamp(1rem, 3vw, 3rem) 1rem; }
    .article-view .article-page { margin: 0 auto; width: min(1180px, 100%); gap: 1.5rem; }
    .article-view .article-shell { padding: clamp(1.25rem, 4vw, 3.5rem); }
    .article-view .article-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 70ch) minmax(0, 1fr);
      max-width: none;
      margin: 0;
      font-size: 1.0625rem;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    .article-view .article-content > * { grid-column: 2; min-width: 0; }
    .article-view .article-content h1 {
      font-size: clamp(2rem, 4.4vw, 3.3rem);
      line-height: 1.12;
      letter-spacing: -.035em;
      margin: 0 0 1rem;
      text-wrap: balance;
    }
    .article-view .article-content h1 + p { color: var(--muted); font-size: .95rem; margin-bottom: 2rem; }
    .article-view .article-content h2 {
      font-size: clamp(1.35rem, 2.5vw, 1.7rem);
      line-height: 1.3;
      margin: 2.7rem 0 1rem;
      scroll-margin-top: 1rem;
    }
    .article-view .article-content p { margin: 0 0 1.2rem; }
    .article-view .article-content figure,
    .article-view .article-content .video-grid {
      grid-column: 1 / -1;
      margin: 1.6rem 0 2rem;
    }
    .article-view .article-content figure {
      padding: clamp(.5rem, 1.8vw, 1.2rem);
      border: 1px solid var(--border);
      background: #090f18;
      border-radius: 10px;
      overflow: hidden;
    }
    .article-view .article-content figure img {
      display: block;
      width: 100%;
      max-height: 680px;
      height: auto;
      margin: 0 auto;
      border: 0;
      object-fit: contain;
    }
    .article-view .article-content figcaption {
      margin: .85rem .25rem .1rem;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.6;
      text-align: center;
    }
    .article-view .article-content figcaption em { font-style: normal; }
    .article-view a.image-expand { display: block; cursor: zoom-in; border-radius: 4px; }
    .article-view a.image-expand:hover img { filter: brightness(1.05); }

    .article-view .architecture-diagram { padding: clamp(1rem, 2.4vw, 1.75rem) !important; }
    .architecture-flow {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: .85rem;
      align-items: stretch;
    }
    .architecture-node {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 112px;
      padding: 1rem .75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #111b29;
      text-align: center;
    }
    .architecture-node:not(:last-child)::after {
      content: "→";
      position: absolute;
      z-index: 2;
      right: -.72rem;
      top: 50%;
      padding: 0 .12rem;
      color: var(--accent);
      background: #090f18;
      font-size: 1.2rem;
      line-height: 1;
      transform: translate(50%, -50%);
    }
    .architecture-node strong { color: var(--text); font-size: .94rem; line-height: 1.35; }
    .architecture-node span { margin-top: .35rem; color: var(--muted); font-size: .78rem; line-height: 1.35; }
    .architecture-services {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      margin-top: 1rem;
      color: var(--muted);
      font-size: .82rem;
    }
    .architecture-services strong { color: var(--text); margin-right: .25rem; }
    .architecture-services span { padding: .3rem .55rem; border: 1px solid var(--border); border-radius: 999px; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }
    .video-card {
      min-width: 0;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #101722;
    }
    .article-view .article-content .video-card h3 {
      margin: 0 0 .8rem;
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1.35;
    }
    .article-view .article-content .video-card p {
      margin: .85rem 0 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.55;
    }
    .video-frame { position: relative; overflow: hidden; aspect-ratio: 16 / 9; border-radius: 6px; background: #05080d; }
    .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .article-links { margin-top: 2rem !important; }
    .article-links a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: .7rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 7px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .article-links a:hover { background: rgba(96, 165, 250, .09); }
    .article-view :focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }

    .image-dialog {
      width: min(1500px, 96vw);
      max-width: 96vw;
      max-height: 94dvh;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b1220;
      color: var(--text);
    }
    .image-dialog::backdrop { background: rgba(2, 6, 23, .9); }
    .image-dialog__toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .image-dialog a { color: var(--accent); }
    .image-dialog button {
      color: var(--text);
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .65rem 1rem;
      font: inherit;
      cursor: pointer;
    }
    .image-dialog img { display: block; max-width: 100%; max-height: 72dvh; width: auto; height: auto; object-fit: contain; margin: 0 auto; }
    .image-dialog p { color: var(--muted); font-size: .9rem; line-height: 1.5; margin: 1rem 0 0; }
    html.image-dialog-open { overflow: hidden; }

    @media (max-width: 900px) {
      .architecture-flow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .architecture-node:nth-child(3)::after { display: none; }
      .video-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .article-view .article-shell { padding: 1.2rem; }
      .article-view .article-content { font-size: 1rem; }
      .article-view .article-content figure,
      .article-view .article-content .video-grid { margin: 1.1rem 0 1.6rem; }
      .article-view .article-content h2 { margin-top: 2rem; }
      .article-view .article-content figcaption { font-size: .875rem; text-align: left; }
      .architecture-flow { grid-template-columns: 1fr; }
      .architecture-node { min-height: 88px; }
      .architecture-node:not(:last-child)::after {
        content: "↓";
        right: 50%;
        top: auto;
        bottom: -.72rem;
        transform: translate(50%, 50%);
      }
      .architecture-node:nth-child(3)::after { display: block; }
    }
    @media print {
      body.article-view { background: white; color: black; padding: 0; }
      .article-view .article-shell { border: 0; background: white; padding: 0; }
      .article-view .article-content { color: black; font-size: 11pt; }
      .article-view .btn--back, .image-dialog, .video-frame { display: none; }
      .article-view .article-content figure, .video-card, .architecture-node { background: white; break-inside: avoid; }
      .article-view .article-content h2 { color: black; break-after: avoid; }
    }
  </style>
</head>
<body class="article-view">
  <main class="page article-page">
    <a class="btn btn--back" href="../../">← Back to Portfolio</a>
    <article class="article-shell" aria-label="LevekGL — Learning How Rendering Works">
      <div class="article-content" id="article-content" aria-busy="true">
        <p class="article-content__loading" role="status">Loading article…</p>
      </div>
      <noscript><p>Enable JavaScript to read this article, or <a href="./article.md">open the Markdown version</a>.</p></noscript>
    </article>
  </main>

  <dialog class="image-dialog" id="image-dialog" aria-label="Enlarged illustration" aria-describedby="image-description">
    <div class="image-dialog__toolbar">
      <a id="image-original" target="_blank" rel="noopener">Open full-size image ↗</a>
      <button id="image-close" type="button" autofocus>Close ×</button>
    </div>
    <img id="image-preview" alt="">
    <p id="image-description"></p>
  </dialog>

  <script src="../controlling-generative-ai-for-game-content/vendor/marked-17.0.5.umd.js"></script>
  <script>
    (() => {
      const content = document.getElementById("article-content");
      const dialog = document.getElementById("image-dialog");
      const preview = document.getElementById("image-preview");
      const original = document.getElementById("image-original");
      const description = document.getElementById("image-description");
      let opener = null;

      document.getElementById("image-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        if (event.target !== dialog) return;
        const box = dialog.getBoundingClientRect();
        if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) dialog.close();
      });
      dialog.addEventListener("close", () => {
        document.documentElement.classList.remove("image-dialog-open");
        if (opener) opener.focus({ preventScroll: true });
      });

      function prepareFigures() {
        for (const paragraph of [...content.querySelectorAll(":scope > p")]) {
          const image = paragraph.querySelector("img");
          if (!image || paragraph.textContent.trim()) continue;
          const figure = document.createElement("figure");
          const next = paragraph.nextElementSibling;
          while (paragraph.firstChild) figure.append(paragraph.firstChild);
          paragraph.replaceWith(figure);
          if (next && next.matches("p") && next.children.length === 1 && next.firstElementChild.tagName === "EM") {
            const caption = document.createElement("figcaption");
            while (next.firstChild) caption.append(next.firstChild);
            figure.append(caption);
            next.remove();
          }
        }
        for (const [index, image] of [...content.querySelectorAll("img")].entries()) {
          image.decoding = "async";
          image.loading = index === 0 ? "eager" : "lazy";
          let link = image.closest("a");
          if (!link) {
            link = document.createElement("a");
            link.href = image.src;
            image.replaceWith(link);
            link.append(image);
          }
          link.classList.add("image-expand");
          link.setAttribute("aria-label", "Enlarge: " + (image.alt || "illustration"));
          link.addEventListener("click", (event) => {
            if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || typeof dialog.showModal !== "function") return;
            event.preventDefault();
            opener = link;
            preview.src = image.currentSrc || image.src;
            preview.alt = image.alt;
            original.href = preview.src;
            description.textContent = image.alt;
            dialog.showModal();
            document.documentElement.classList.add("image-dialog-open");
          });
        }
      }

      async function loadArticle() {
        try {
          if (location.protocol === "file:") throw new Error("LOCAL_FILE");
          const response = await fetch("./article.md", { cache: "no-cache" });
          if (!response.ok) throw new Error("Article response: " + response.status);
          if (!window.marked) throw new Error("Markdown reader unavailable");
          content.innerHTML = marked.parse(await response.text(), { gfm: true });
          prepareFigures();
        } catch (error) {
          content.replaceChildren();
          const message = document.createElement("p");
          message.className = "article-content__error";
          message.setAttribute("role", "alert");
          message.textContent = location.protocol === "file:"
            ? "Please open this page through the website or a local web server to load the article."
            : "The article could not be loaded. Please reload the page or open the text below.";
          const link = document.createElement("a");
          link.href = "./article.md";
          link.textContent = "Read the Markdown article";
          content.append(message, link);
          console.error(error);
        } finally {
          content.setAttribute("aria-busy", "false");
        }
      }

      loadArticle();
    })();
  </script>
</body>
</html>
