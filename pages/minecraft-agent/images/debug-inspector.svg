<title id="title">A simplified inspector with a missing-tool error selected</title><desc id="description">Four recorded calls: #12 collect_resource collected one oak_log; #13 collect_resource requested 11 cobblestone and failed with MISSING_ITEM; #14 find_nearest_blocks returned no cobblestone blocks; #15 get_dropped_items returned no cobblestone items. Selected call #13 shows actual prompt excerpts, item cobblestone, quantity 11, and the recorded error: No inventory tool can harvest cobblestone from stone without changing its drop. There were 14 sources but zero collected items. Inventory stayed at one oak_log. This is a condensed editorial layout, not a screenshot of the original UI.</desc>
<rect width="100%" height="100%" rx="16" fill="#101722"/>
<g font-family="Segoe UI, sans-serif"><text x="34" y="49" font-size="34" fill="#e5e7eb" font-weight="600">Reading a failure, not just watching the bot</text><text x="34" y="84" font-size="22" fill="#aab8cc" >Condensed inspector · 2026-10-20 · four recorded tool calls</text><rect x="28" y="112" width="1384" height="78" rx="10" fill="#151f2e" stroke="#334155"/><text x="50" y="144" font-size="18" fill="#67e8f9" font-weight="600">REQUEST</text><text x="50" y="174" font-size="23" fill="#e5e7eb" >Craft a stone pickaxe, use a furnace, then craft an iron pickaxe from nearby resources. Start empty.</text><text x="34" y="236" font-size="24" fill="#e5e7eb" font-weight="600">Action agent · tool history</text><rect x="28" y="259" width="456" height="115" rx="10" fill="#151f2e" stroke="#334155"/><text x="47" y="289" font-size="17" fill="#5dd6a0" font-weight="600">RETURNED</text><text x="465" y="289" font-size="18" fill="#aab8cc" text-anchor="end">4:05</text><text x="47" y="322" font-size="23" fill="#e5e7eb" font-family="Consolas, monospace">#12 collect_resource</text><text x="47" y="353" font-size="20" fill="#aab8cc" >1 oak_log collected</text><rect x="28" y="392" width="456" height="115" rx="10" fill="#2b1e2b" stroke="#ff8991"/><text x="47" y="422" font-size="17" fill="#ff8991" font-weight="600">ERROR · SELECTED</text><text x="465" y="422" font-size="18" fill="#aab8cc" text-anchor="end">4:12</text><text x="47" y="455" font-size="23" fill="#e5e7eb" font-family="Consolas, monospace">#13 collect_resource</text><text x="47" y="486" font-size="20" fill="#aab8cc" >Missing harvesting tool</text><rect x="28" y="525" width="456" height="115" rx="10" fill="#151f2e" stroke="#334155"/><text x="47" y="555" font-size="17" fill="#5dd6a0" font-weight="600">RETURNED</text><text x="465" y="555" font-size="18" fill="#aab8cc" text-anchor="end">4:30</text><text x="47" y="588" font-size="23" fill="#e5e7eb" font-family="Consolas, monospace">#14 find_nearest_blocks</text><text x="47" y="619" font-size="20" fill="#aab8cc" >0 cobblestone blocks found</text><rect x="28" y="658" width="456" height="115" rx="10" fill="#151f2e" stroke="#334155"/><text x="47" y="688" font-size="17" fill="#5dd6a0" font-weight="600">RETURNED</text><text x="465" y="688" font-size="18" fill="#aab8cc" text-anchor="end">4:32</text><text x="47" y="721" font-size="23" fill="#e5e7eb" font-family="Consolas, monospace">#15 get_dropped_items</text><text x="47" y="752" font-size="20" fill="#aab8cc" >0 loose cobblestone items found</text><rect x="508" y="212" width="904" height="695" rx="10" fill="#151f2e" stroke="#334155"/><text x="534" y="249" font-size="29" fill="#e5e7eb" font-family="Consolas, monospace">#13 collect_resource</text><text x="1384" y="249" font-size="21" fill="#ff8991" text-anchor="end" font-weight="600">ERROR</text><text x="534" y="282" font-size="21" fill="#aab8cc" >Action agent · 4:12 into the request · 0.159 s</text><line x1="534" y1="303" x2="1386" y2="303" stroke="#334155" /><text x="534" y="338" font-size="18" fill="#67e8f9" font-weight="600">PROMPT · EXCERPT</text><text x="534" y="372" font-size="23" fill="#e5e7eb" >You control a Minecraft bot through the supplied tools.</text><text x="534" y="406" font-size="23" fill="#e5e7eb" >After a failure, retry only with new evidence or a relevant</text><text x="534" y="437" font-size="23" fill="#e5e7eb" >change.</text><text x="534" y="480" font-size="18" fill="#67e8f9" font-weight="600">DELEGATION</text><text x="534" y="514" font-size="23" fill="#e5e7eb" >Execute step 1 of the current plan.</text><text x="534" y="560" font-size="18" fill="#67e8f9" font-weight="600">TOOL INPUT</text><text x="534" y="598" font-size="25" fill="#e5e7eb" font-family="Consolas, monospace">item: cobblestone    quantity: 11</text><rect x="531" y="623" width="858" height="195" rx="10" fill="#2b1e2b" stroke="#75404f"/><text x="552" y="657" font-size="22" fill="#ff8991" font-weight="600" font-family="Consolas, monospace">MISSING_ITEM</text><text x="552" y="694" font-size="23" fill="#e5e7eb" >No inventory tool can harvest cobblestone from stone without</text><text x="552" y="725" font-size="23" fill="#e5e7eb" >changing its drop.</text><text x="552" y="784" font-size="23" fill="#e5e7eb" >Sources found: 14   ·   Collected: 0 / 11</text><text x="534" y="856" font-size="22" fill="#aab8cc" >Inventory before / after: 1 oak_log → 1 oak_log</text><text x="534" y="888" font-size="22" fill="#aab8cc" >No cobblestone was collected by this call.</text><text x="34" y="833" font-size="23" fill="#67e8f9" >A valid call can fail because</text><text x="34" y="864" font-size="23" fill="#67e8f9" >the bot lacks a prerequisite.</text><text x="34" y="949" font-size="19" fill="#aab8cc" >Layout simplified for the article. Prompt and error excerpts are from the saved trace; request wording is shortened.</text><text x="34" y="981" font-size="18" fill="#aab8cc" >Source: campaign_1792497383278_f1e7505b · calls #12–15</text></g></svg>
